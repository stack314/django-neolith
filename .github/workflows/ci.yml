name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing by default, read-only checkout per job.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev "Django~=5.2.0"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    # ADR 0012: the floor and the newest supported pair, on x86-64 and arm64.
    name: Python ${{ matrix.python }}, Django ${{ matrix.django }}, ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, arm64]
        pair: [floor, newest]
        include:
          - pair: floor
            python: "3.12"
            django: "5.2"
          - pair: newest
            python: "3.15"
            django: "6.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the built package, not the source tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group test "Django~=${{ matrix.django }}.0"
      - name: Test (deprecation warnings are errors)
        run: python -m pytest
