name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# Least privilege: nothing by default, read-only checkout per job.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev "Django~=5.2.0"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # The tests and the docs checks read files from across the repository,
      # so the sdist carries every tracked file: built with the tools the
      # release pins, in a venv of their own.
      - name: The sdist carries every tracked file
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/release-constraints.txt
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install pip build
          "$RUNNER_TEMP/build/bin/python" -m build --sdist --outdir "$RUNNER_TEMP/dist"
          python scripts/sdist_check.py "$RUNNER_TEMP"/dist/*.tar.gz
      # ADR 0024: the docs site builds, and its checks pass: the citations in
      # the mirrored records and specification among them. Sphinx 9.2 needs
      # Python 3.13, so the site is built in a venv of its own.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: docs-python
        with:
          python-version: "3.13"
          update-environment: false
      - name: The docs site builds and its checks pass
        env:
          DOCS_PYTHON: ${{ steps.docs-python.outputs.python-path }}
        run: |
          "$DOCS_PYTHON" -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python" -m pip install . --group docs "Django~=5.2.0"
          "$RUNNER_TEMP/docs/bin/python" scripts/docs.py check --out "$RUNNER_TEMP/site"

  test:
    # ADR 0012: the floor and the newest supported pair, on x86-64 and arm64.
    name: Python ${{ matrix.python }}, Django ${{ matrix.django }}, ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, arm64]
        pair: [floor, newest]
        include:
          - pair: floor
            python: "3.12"
            django: "5.2"
          - pair: newest
            python: "3.15"
            django: "6.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the built package, not the source tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group test "Django~=${{ matrix.django }}.0"
      - name: Test (deprecation warnings are errors)
        run: python -m pytest --spec-report=spec-report.json
      # ADR 0018: requirement IDs in spec/, and coverage from the tests that
      # passed in this run. Coverage is enforced per document, as listed in
      # tests/spec_trace.toml.
      - name: Spec trace
        run: python scripts/spec_trace.py --report spec-report.json
