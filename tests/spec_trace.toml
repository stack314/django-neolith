# Spec trace settings for django-neolith (ADR 0018, CONTRIBUTING T5).
# Read by scripts/spec_trace.py.

# Documents whose must-level requirements need a citing test. The pull request
# of the roadmap step that implements a document adds its number here.
enforce = ["01", "02"]

# Must-level requirements that no test in this implementation verifies, each
# with the reason: what verifies it instead, or the roadmap step that will test
# it. An entry is removed when a test starts citing the requirement.
[not-tested]
OVR-2 = "Binds app code. Checked by the boundary check, roadmap step 7."
OVR-5 = "Shown by the example apps running attached and detached, roadmap step 8."
OVR-7 = "Binds app code, which keeps the call context out of request types."
CON-1 = "Binds contract authors. Breaking-change detection is deferred past 0.1."
CON-5 = "Binds app authors. The conformance suite checks it for the reference contract, roadmap step 6."
CON-12 = "Holds by construction in this implementation: a contract's actions are the methods of one class, where a name occurs once. A redefined method replaces the earlier one before neolith sees the class, and linters report it (pyflakes F811)."
CON-39 = "Binds receivers that read text from a network: the receive check, roadmap step 5 (#12), which reuses the description check that senders run (TRN-15). In-process, a receiver reads only text that a sender's check passed (ADR 0007 Decision 3)."
CON-40 = "Binds receivers that read text from a network: the receive check, roadmap step 5 (#12). Senders meet the same rules, tested under TRN-15."
CON-42 = "Binds receivers that read text from a network: the receive check, roadmap step 5 (#12). In-process, a receiver reads only text that a sender wrote (CON-41)."
