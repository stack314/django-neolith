[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-neolith"
dynamic = ["version"]
description = "Deploy Django apps, not Django projects."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Vignesh Pai and django-neolith contributors" }]
requires-python = ">=3.12"
# Runtime dependencies need an Accepted decision record (CONTRIBUTING K5).
# Django: ADR 0012 sets the floor and milestone. Pydantic: ADR 0006 makes
# contract types Pydantic v2 models; 2.12 is the oldest release the suite has
# been run against.
dependencies = ["Django>=5.2", "pydantic>=2.12,<3"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/stack314/django-neolith"
Issues = "https://github.com/stack314/django-neolith/issues"
Changelog = "https://github.com/stack314/django-neolith/blob/main/CHANGELOG.md"

[dependency-groups]
# markdown-it-py: the spec trace parses spec/ as CommonMark (ADR 0018). Development
# and CI only, never a runtime dependency; pinned so the parse cannot drift.
# hypothesis, hypothesis-jsonschema and jsonschema: the contract round-trip
# property test (spec 01, CON-16). Test only.
# griffe: tests/test_api_docs.py reads the public API's docstrings with it.
# Test only; pinned so its reading of a docstring cannot drift.
test = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "packaging>=25",
    "markdown-it-py==4.2.0",
    "hypothesis>=6.170",
    "hypothesis-jsonschema>=0.23.2",
    "jsonschema>=4.26",
    # The property test checks "date" and "date-time" formats; jsonschema needs
    # this to check "date-time" and otherwise skips it silently.
    "rfc3339-validator>=0.1.4",
    "griffe==2.4.1",
]
# sphinx, myst-parser and pydata-sphinx-theme: the documentation site, built
# by scripts/docs.py (ADR 0024). Sphinx 9.2 needs Python 3.13, so on an older
# interpreter the group installs none of them; the library's floor stays 3.12.
# The direct dependencies are pinned exactly; their own dependencies follow
# the ranges those packages declare.
docs = [
    "sphinx==9.2.0; python_version >= '3.13'",
    "myst-parser==5.2.0; python_version >= '3.13'",
    "pydata-sphinx-theme==0.24.0; python_version >= '3.13'",
    "markdown-it-py==4.2.0",
]
lint = ["ruff>=0.14", "mypy>=1.18", "django-stubs>=5.2", "types-jsonschema>=4.26"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.hatch.version]
path = "src/neolith/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neolith"]

[tool.hatch.build.targets.sdist]
# docs/, VISION.md, CONTRIBUTING.md and CODE_OF_CONDUCT.md: the tests read the
# records and the site's sources, and the site links them (ADR 0024).
include = [
    "src/neolith",
    "tests",
    "scripts",
    "spec",
    "docs",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "VISION.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
# pytester: the spec trace plugin is tested by running pytest on sample tests.
# scripts.spec_trace_plugin: loaded with -p, not from a conftest, so pytest knows
# --spec-report before it picks conftests from the paths in its arguments (ADR 0018).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-p",
    "pytester",
    "-p",
    "scripts.spec_trace_plugin",
]
xfail_strict = true
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
pythonpath = ["."]
# ADR 0018: a test cites the requirements it verifies; scripts/spec_trace.py checks the IDs.
markers = ["spec(*ids): requirement IDs from spec/ that this test verifies"]
# ADR 0012: deprecations are errors. Django's RemovedInDjango*Warning classes
# subclass DeprecationWarning or PendingDeprecationWarning, so they are covered.
# A filter for a third-party warning names the package and the upstream issue.
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# Python sources only: Markdown code blocks are illustrative sketches.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade: no syntax older than the floor
    "B",            # bugbear
    "SIM",          # simplify
    "PT",           # pytest style
    "DJ",           # django
    "TID",          # tidy imports
    "RUF",          # ruff-specific
    "S",            # bandit: secure by default (K9)
    "ANN",          # annotations (K1)
    "FIX", "TD",    # no TODO/FIXME (K3)
    "D",            # docstrings, in Google sections
]
# D205: a summary may run over two lines in a private helper.
# tests/test_api_docs.py holds the public API to a one-line summary.
ignore = ["D205"]

[tool.ruff.lint.per-file-ignores]
# Tests are named for what they check, and scripts are not API.
"tests/**" = ["S101", "D"]
"scripts/**" = ["D1"]
# Migrations are written by Django's makemigrations, as Django writes them.
"tests/**/migrations/*" = ["RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# These tests build contract declarations from free functions, whose "..."
# bodies mypy accepts only inside a Protocol class.
module = "tests.test_contracts"
disable_error_code = ["empty-body"]

[[tool.mypy.overrides]]
# scripts/docs.py imports Sphinx only to build, and the docs group installs it
# only on Python 3.13 or newer (ADR 0024).
module = ["sphinx", "sphinx.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"
